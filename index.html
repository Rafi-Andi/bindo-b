{id:5, passage:'<div class="passage-title">Layur, Teruslah Berlayar<br><small>Soal 5 — full teks dari web</small></div><p>Teks untuk soal nomor 5 s.d. 8. Layur, Teruslah Berlayar &quot;Bapak, pulanglah,&quot; lirih Layur berharap. Ini hari keenam. Tiga hari adalah waktu terlama nelayan berada di laut. Dengan susah payah, Layur berpindah duduk ke dalam sebuah perahu tua. Penyangga kedua kaki Layur yang tak utuh ia letakkan di sampingnya. &quot;Jangan-jangan...&quot; &quot;Tidak ... Aku tidak boleh berpikiran buruk. Bapak pasti pulang dengan selamat. Aku akan tetap menunggunya di sini sambil berdoa.&quot; Layur masih ingat masa-masa dulu, ketika Bapak berlayar pada malam hari dan keesokan harinya sudah merapat kembali di pantai dengan membawa ikan berlimpah. &quot;Ayo! Siapa mau udang?&quot; panggil Bapak. Layur berlari kencang bersama teman-temannya. Namun, itu adalah kenangan sepuluh tahun silam. Kini, udang dan ikan kecil adalah anugerah besar. Itu pun harus dijaring di tengah laut. Layur ingat betul, Bapak adalah pembuat bondet paling disegani, juga berpengaruh di dusun. Setiap hari, nelayan silih berganti datang ke rumah memesan bondet. Hasil panen ikan berlimpah. Tinggal melemparkan bondet ke dalam laut dan ... bum! Berkuintal-kuintal ikan terapung tinggal diserok menggunakan jaring. Sampai suatu ketika... DUAAAR! Separuh rumah Layur luluh lantak karena simpanan bondet di gudang meledak. Ledakan bondet di gudang tak hanya merusak rumah tetapi juga mencelakai anak semata wayang. Ia berteriak minta tolong, menepuk-nepuk dadanya, dan menangis. Itulah titik balik yang amat disesali Bapak. Sejak itu, Bapak meninggalkan usaha pembuatan bondet. Demikian pula dengan warga Dusun Prau tempat mereka berdiam berangsur-angsur meninggalkan cara menangkap ikan dengan bondet. Lamat-lamat terlihat kibaran layar bercorak biru. Layur beringsut menuruni perahu tempatnya duduk. Lambaian tangan bapaknya semakin jelas dan semakin dekat. &quot;Bapak dari mana? Bapak sudah tiga hari telat pulang!&quot; Seru Layur kesal. Matanya berkaca-kaca, menahan rindu, dan cemas. (Karya Anang YB) Daftar Istilah: Bondet: istilah lokal yang merujuk pada bahan peledak rakitan, sering disebut juga bom ikan. Sumber: https://buku.kemdikbud.go.id/katalog/layur-tetaplah-berlayar (dengan pengubahan)</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Berdasarkan teks tersebut, bagaimana sifat yang dimiliki oleh Layur', opts:['Nekat dan optimis','Mudah cemas dan tabah','Penuh harap dan kasih sayang','Suka menyendiri dan tegas','Cepat panik dan menyalahkan keadaan'], kunci:[2], bahas:'<b>Sesuai kunci web defantri: (C) Penuh harap dan kasih sayang.</b> Difetch langsung dari atribut value=correct pada halaman.'},

{id:9, passage:'<div class="passage-title">Pantai Bersih Tanpa Sampah<br><small>Soal 9 — full teks dari web</small></div><p>Teks untuk soal nomor 9 s.d. 11. Pantai Bersih Tanpa Sampah Di sebuah daerah wisata yang terkenal dengan pantainya yang indah, pemerintah setempat gencar mengampanyekan &quot;Pantai Bersih Tanpa Sampah.&quot; Spanduk dan papan peringatan terpampang di berbagai sudut. Namun, kenyataannya seringkali berbeda. Suatu sore, Pak Wayan, seorang nelayan tua yang sudah puluhan tahun melaut, sedang membersihkan jaringnya di tepi pantai. Di sampingnya, sekelompok turis muda asyik berpose untuk berfoto. Mereka mengenakan topi pantai yang modis, kacamata hitam, dan membawa botol minum berwarna-warni. &quot;Wah, pantainya bersih banget ya, guys!&quot; seru salah satu turis sambil memegang ponselnya. &quot;Pas banget buat konten &#x27;liburan ramah lingkungan&#x27;!&quot; Temannya menimpali, &quot;Iya! Nanti caption-nya &#x27;Menikmati keindahan alam tanpa jejak, menjaga bumi kita tercinta!&#x27;&quot; Setelah puas berfoto dari berbagai sudut dengan beragam filter, mereka beranjak pergi. Namun mereka meninggalkan botol minuman plastik kosong, bungkus keripik, dan beberapa puntung rokok yang disembunyikan di balik semak-semak. Mereka bahkan tidak berusaha mencari tempat sampah yang hanya berjarak beberapa meter. Pak Wayan hanya bisa menggelengkan kepala. Ia berjalan mendekat dan memungut sampah-sampah itu satu per satu. Ia sudah terbiasa dengan pemandangan ini. Para turis datang untuk menikmati keindahan, berfoto, membuat konten, lalu pergi meninggalkan &quot;kenangan&quot; dalam bentuk sampah. Tak lama kemudian, seorang petugas kebersihan berseragam oranye datang dengan sapu dan karung. &quot;Pak Wayan, sudah banyak lagi ya sampahnya?&quot; tanyanya sambil menghela napas. &quot;Sudah biasa, Nak,&quot; jawab Pak Wayan. &quot;Ini namanya &#x27;sampah estetik&#x27;. Cuma bagus di foto, tapi busuk di mata dan bau di hidung.&quot; Petugas itu tersenyum masam. &quot;Iya, Pak. Kata mereka peduli lingkungan, tapi pedulinya cuma di caption media sosial.&quot; Malam harinya, di akun media sosial Pak Wayan—yang diajari cucunya—ia melihat foto-foto pantai yang diunggah para turis tadi. Pantai tampak bersih sempurna, dihiasi filter matahari terbenam yang memukau. Ia membaca caption-nya: &quot;Surgaku, jangan kau kotori!&quot; Pak Wayan hanya bisa tersenyum getir. Sepertinya, slogan &quot;Pantai Bersih Tanpa Sampah&quot; itu hanya berlaku untuk kamera dan media sosial. Sementara di balik layar, jejak yang ditinggalkan justru lebih nyata dan memprihatinkan daripada gambar yang dipamerkan.</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Manakah urutan peristiwa berikut yang paling sesuai dengan isi teks', opts:['Pak Wayan melihat foto turis di media social → petugas kebersihan datang → turis membuat konten','Turis berfoto dan membuat konten → Pak Wayan memungut sampah → petugas kebersihan datang','Pemerintah mengampanyekan kebersihan → Pak Wayan melihat foto turis → petugas kebersihan datang','Petugas kebersihan datang → turis membuat konten di media soal → Pak Wayan memungut sampah','Pak Wayan memungut sampah → turis membuat konten → pemerintah mengampanyekan kebersihan'], kunci:[1], bahas:'<b>Sesuai kunci web defantri: (B) Turis berfoto dan membuat konten → Pak Wayan memungut sampah → petugas kebersihan datang.</b> Difetch langsung dari atribut value=correct pada halaman.'},

{id:12, passage:'<div class="passage-title">Pulihkan Ekosistem, Menjaga Planet Kita<br><small>Soal 12 — full teks dari web</small></div><p>Teks untuk soal nomor 12 s.d. 14. Pulihkan Ekosistem, Menjaga Planet Kita dari Generasi ke Generasi Berdasarkan hasil riset LIPI (Lembaga Ilmu Pengetahuan Indonesia) terjadi peningkatan sampah plastik selama pandemik. Hal ini disebabkan oleh penggunaan layanan delivery makanan lewat jasa transportasi online, 96% paket dibungkus dengan plastik yang tebal dan ditambah dengan bubble wrap. Selain itu selotip, bungkus plastik, dan bubble wrap merupakan pembungkus berbahan plastik yang paling sering ditemukan. Sampah medis juga melonjak. Kementerian Lingkungan Hidup dan Kehutanan (KLHK) menyatakan bahwa selama pandemi, terjadi peningkatan timbunan sampah medis sebesar 30% hingga 50%. Dari data tersebut, Indonesia merupakan negara ke-2 penyumbang polusi sampah di lautan (3,22 metrik ton per tahun). Salah satu faktor penyebab dari permasalahan tersebut adalah dengan pertambahan jumlah penduduk akan terjadi peningkatan aktivitas manusia dan daya konsumsi yang melonjak. Hal itu menyebabkan meningkatnya jumlah dan jenis limbah sehingga menyebabkan lingkungan menjadi tercemar. Selain sampah, penebangan pohon secara liar sampai pada kebakaran hutan menjadi penyumbang terbesar dalam kerusakan ekosistem. Banyak aktivitas manusia yang mengancam pelestarian lingkungan sehingga menyebabkan ketidakseimbangan ekosistem. Manusia punya peran besar dalam menjaga keseimbangan ekosistem, bukan cuma untuk sekarang, tapi juga untuk generasi mendatang. Tanggung jawab dalam menjaga lingkungan, tentunya bukan hanya dibebankan oleh pemerintah saja, tetapi seluruh elemen masyarakat harus bahu-membahu dalam menjaga dan melestarikan lingkungan. Bertepatan dengan peringatan Hari Lingkungan Hidup Sedunia, yang tidak hanya sebagai seremonial belaka, tentunya menjadi sebuah harapan dalam meningkatkan kesadaran menjaga dan melestarikan lingkungan. Selain itu, memberikan semangat baru bagi kita semua untuk komitmen menjaga lingkungan. Dengan memulai dari diri sendiri dan hal paling kecil, yaitu tidak membuang sampah sembarangan, terutama sampah plastik karena merusak ekosistem laut, tidak menebang pohon dengan liar hingga membuat gundul hutan. Mari bersama merobohkan jurang ekologi, memulihkan ekosistem bumi dengan pendekatan pengelolaan sumber daya alam yang adil dan berkelanjutan. Sumber: https://uiad.ac.id/2021/06/06/opini-pulihkan-ekosistem-menjaga-planet-kita-dari-generasi-ke-generasi/ (dengan pengubahan)</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Bagaimana hubungan makna antara paragraf 1 dan paragraf 2 dalam teks tersebut', opts:['Paragraf 2 menjelaskan akibat dari fenomena sampah yang diuraikan di paragraf 1','Paragraf 2 menyajikan solusi awal untuk permasalahan yang diperkenalkan di paragraf 1','Paragraf 2 memberikan contoh spesifik dari jenis sampah yang disebutkan di paragraf 1','Paragraf 2 mengkritisi data yang rancu tentang sampah yang disajikan di paragraf 1','Paragraf 2 menguraikan penyebab dari permasalahan yang dijabarkan di paragraf 1'], kunci:[4], bahas:'<b>Sesuai kunci web defantri: (E) Paragraf 2 menguraikan penyebab dari permasalahan yang dijabarkan di paragraf 1.</b> Difetch langsung dari atribut value=correct pada halaman.'},

{id:15, passage:'<div class="passage-title">Prospek Ekonomi Global di Tengah Ketidakpastian<br><small>Soal 15 — full teks dari web</small></div><p>Teks untuk soal nomor 15 s.d. 17. Prospek Ekonomi Global di Tengah Ketidakpastian Jakarta, Senin, 16 Juni 2025 – Perekonomian global terus menghadapi tantangan signifikan di tengah ketidakpastian geopolitik dan tekanan inflasi yang persisten. Analisis terbaru yang dirilis pada (Senin, 2/6/2025), oleh Dana Moneter Internasional (IMF) menunjukkan adanya divergensi dalam laju pemulihan ekonomi antarwilayah, di mana beberapa negara seperti Amerika Serikat dan India menunjukkan ketahanan yang lebih baik, sementara negara-negara di Eropa dan Tiongkok masih berjuang mengatasi dampak guncangan eksternal. Kenaikan harga energi dan pangan tetap menjadi pendorong utama inflasi di banyak negara, dipicu oleh gangguan rantai pasok global dan konflik di Ukraina, memaksa bank sentral untuk mempertahankan kebijakan moneter yang ketat. Upaya ini, meskipun esensial untuk mengendalikan kenaikan harga, berpotensi mengerem pertumbuhan ekonomi. Para pengambil kebijakan dihadapkan pada dilema sulit: menyeimbangkan kebutuhan untuk meredam inflasi tanpa memicu resesi yang dalam. &quot;Kami melihat adanya perlambatan pertumbuhan global yang signifikan di tahun ini, dan risiko resesi menjadi lebih nyata jika bank sentral terlalu agresif dalam menaikkan suku bunga,&quot; ujar seorang ekonom senior dari Bank Dunia, dalam sebuah webinar yang diadakan, (Rabu, 11/6). Di sisi lain, sektor manufaktur global menunjukkan tanda-tanda perlambatan, tercermin dari menurunnya indeks manajer pembelian (PMI) di beberapa ekonomi besar seperti Jerman dan Jepang. Penurunan permintaan ekspor dan gangguan rantai pasok masih menjadi perhatian utama bagi produsen. Namun, sektor jasa justru menunjukkan resiliensi yang lebih kuat, didukung oleh kembali normalnya aktivitas setelah pandemi, sebuah tren yang mulai terlihat sejak awal Desember 2024. Pasar tenaga kerja di beberapa negara maju masih relatif ketat, dengan tingkat pengangguran yang rendah. Kondisi ini memberikan dukungan terhadap daya beli konsumen, meskipun tekanan biaya hidup yang tinggi dapat mengikis dampaknya. Sementara itu, investasi langsung asing (FDI) cenderung melambat, mencerminkan kehati-hatian investor di tengah prospek ekonomi yang tidak menentu. Ke depan, koordinasi kebijakan ekonomi antarnegara akan menjadi kunci untuk menstabilkan kondisi global. Reformasi struktural yang bertujuan meningkatkan produktivitas dan daya saing juga dianggap krusial untuk memastikan pertumbuhan yang berkelanjutan dalam jangka panjang. Para ekonom memprediksi bahwa prospek ekonomi akan sangat bergantung pada evolusi inflasi, respons kebijakan moneter, dan perkembangan situasi geopolitik di seluruh dunia. Bagi Indonesia, kondisi ini menuntut kewaspadaan dan diversifikasi ekonomi agar tidak terlalu rentan terhadap gejolak global dalam kurun waktu tiga hingga enam bulan ke depan, terhitung sejak (16/6/2025). Sumber: Disadur dan diadaptasi dari rilis pers dan laporan Global Economic Prospects, Juni 2025 oleh World Bank (Bank Dunia).</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Fenomena yang menggambarkan "inflasi" berdasarkan teks di atas adalah', opts:['Pengencangan anggaran negara karena kurangnya barang dan jasa','Kenaikan harga barang dan jasa secara terus menerus dalam kurun waktu tertentu','Biaya yang mendorong kemandirian ekonomi hingga mampu bersaing secara global','Pergeseran tren pasar global terhadap produk-produk dari Indonesia','Lambatnya sektor manufaktur global akibat menurunnya pembelian'], kunci:[1], bahas:'<b>Sesuai kunci web defantri: (B) Kenaikan harga barang dan jasa secara terus menerus dalam kurun waktu tertentu.</b> Difetch langsung dari atribut value=correct pada halaman.'},

{id:18, passage:'<div class="passage-title">Tari Hudoq<br><small>Soal 18 — full teks dari web</small></div><p>Teks untuk soal nomor 18 s.d. 21. Tari Hudoq: Warisan Budaya yang Harus Dilestariakan Tari Hudoq dari suku Dayak Modang di Kalimantan Timur bukan sekadar tontonan seni biasa. Lebih dari itu, tarian ini adalah warisan budaya yang sarat akan makna spiritual dan simbolis. Oleh karena itu, melestarikan Tari Hudoq menjadi sebuah keharusan, tidak hanya untuk menjaga keragaman budaya Indonesia, tetapi juga untuk mengingatkan kita akan pentingnya hubungan harmonis antara manusia dan alam. Pertama, Tari Hudoq adalah cerminan dari kearifan lokal yang mengajarkan nilai-nilai fundamental. Tarian ini merupakan bagian integral dari ritual keagamaan untuk menjalin hubungan harmonis dengan roh penjaga pertanian, Halaeng Heboung, dan roh pelindung umat manusia, Selo Sen. Dalam era modern yang sering kali mengabaikan hubungan manusia dengan alam, tarian ini berfungsi sebagai pengingat kuat akan ketergantungan kita pada alam dan pentingnya menghormati kekuatan yang lebih besar dari diri kita. Kedua, setiap elemen dalam Tari Hudoq mengandung simbolisme yang mendalam dan relevan. Penggunaan topeng kayu yang besar dan dedaunan yang menutupi tubuh penari bukan sekadar properti, melainkan representasi kekuatan dan perlindungan dari roh-roh tersebut. Gerakan tari yang menggambarkan keteguhan petani serta nyanyian tradisional yang mengiringinya adalah permohonan tulus kepada alam semesta untuk memberikan keseimbangan dan kesuksesan panen. Menghilangkan tarian ini berarti menghilangkan simbolisme penting yang telah diwariskan turun-temurun, yang merupakan esensi dari budaya Dayak Modang itu sendiri. Ketiga, Tari Hudoq memiliki nilai edukatif yang tinggi bagi masyarakat luas, termasuk wisatawan. Pertunjukan ini tidak hanya memukau secara visual, tetapi juga memberikan pemahaman tentang pentingnya keseimbangan alam dan hubungan spiritual yang mendalam. Dengan melestarikan dan memperkenalkan tarian ini kepada publik yang lebih luas, kita tidak hanya menjaga keberadaan tarian itu sendiri, tetapi juga menyebarkan pesan tentang pentingnya menjaga lingkungan dan menghargai nilai-nilai tradisional. Dengan demikian, jelaslah bahwa Tari Hudoq bukan sekadar pertunjukan, melainkan sebuah jembatan spiritual yang menghubungkan manusia dengan alam dan leluhur. Mengabaikan pelestariannya sama saja dengan mengabaikan kekayaan spiritual dan kearifian lokal yang menjadi fondasi budaya kita. Pelestarian Tari Hudoq adalah investasi untuk masa depan, memastikan bahwa nilai-nilai berharga ini tetap hidup dan relevan bagi generasi mendatang. Sumber: https://kebudayaan.kemdikbud.go.id/ditwdb/hudoq/ (dengan penyesuaian) https://pustakaborneo.id/artikel/hudoq-tradisi-tari-sakral-suku-dayak-di-kalimantan (dengan penyesuaian) https://1001indonesia.net/hudoq-tarian-sakral-dari-suku-dayak/ (dengan penyesuaian) https://www.timesnusantara.com/2024/12/08/tari-hudoq-tarian-spiritual-yang-menghubungkan-manusia-dengan-alam/ (dengan penyesuaian)</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Makna dari istilah Halaeng Heboung dan Selo Sen dalam teks tersebut adalah', opts:['Jenis topeng yang digunakan dalam tari Hudoq untuk menciptakan kesan mistis','Nama-nama suku asli Dayak Modang yang menjadi leluhur pencipta tari Hudoq','Judul nyanyian tradisional yang mengiringi tiap gerakan dalam tari Hudoq','Sebutan khusus untuk roh penjaga pertanian dan roh pelindung umat manusia','Simbol kesuburan tanah dan kesejahteraan hidup masyarakat Dayak Modang'], kunci:[3], bahas:'<b>Sesuai kunci web defantri: (D) Sebutan khusus untuk roh penjaga pertanian dan roh pelindung umat manusia.</b> Difetch langsung dari atribut value=correct pada halaman.'},

{id:22, passage:'<div class="passage-title">Tradisi Belis<br><small>Soal 22 — full teks dari web</small></div><p>Teks untuk soal nomor 22 s.d. 25. Tradisi Belis: Simbol Budaya yang Menyimpan Beban Finansial di Era Modern Belis adalah tradisi di wilayah Indonesia bagian timur seperti Nusa Tenggara Timur, yang secara umum di Indonesia dikenal dengan mas kawin atau mahar. Tradisi ini melambangkan penghormatan kepada wanita dan penyatuan keluarga. Namun, di balik nilainya, belis sering menjadi beban finansial berat bagi pihak laki-laki, yang kadang memicu tekanan psikologis dan mengganggu hubungan kekeluargaan. Beberapa pihak, terutama para sesepuh desa atau orang-orang tua, kadang terlalu kukuh untuk mempertahankan tradisi dan membuat tekanan dengan nilai yang semakin naik. Belis memiliki makna yang mendalam dan dianggap sebagai bentuk pengakuan atas peran penting seorang perempuan di dalam keluarga. Belis merupakan representasi keseriusan dan komitmen seorang pria untuk membangun keluarga. Proses penyerahan belis tidak hanya dimaknai sebagai pertukaran materi, tetapi juga sebagai simbol penyatuan dua komunitas besar, yakni keluarga kedua belah pihak. Pada masyarakat Lamaholot misalnya, belis diwujudkan dalam bentuk gading gajah atau bala, yang besarnya disesuaikan dengan status sosial seorang perempuan. Selain itu, disertakan juga pelengkap belis seperti sarung tenun sutra dan ternak. Uniknya, meskipun belis dari pihak laki-laki, pihak keluarga perempuan memberikan balasan simbolis kepada pihak laki-laki dalam bentuk barang berharga lainnya. Tradisi ini mengajarkan keseimbangan dan saling menghargai di antara kedua belah pihak. Meskipun belis mengandung nilai-nilai yang positif, tantangannya saat ini adalah menjaga agar tradisi tersebut tidak menjadi beban finansial yang berat. Tuntutan belis yang tinggi sering kali menjadi sumber tekanan, terutama bagi keluarga laki-laki. Dalam beberapa kasus, perkara belis dapat berimbas pada kesehatan mental hingga memicu tindakan tragis, seperti yang pernah terjadi di Kupang. Selain menjadi tantangan finansial, besarnya tuntutan materi untuk belis juga sering kali menimbulkan ketegangan dan konflik di antara pasangan dan keluarganya. Ketika keluarga perempuan menetapkan nominal belis yang tinggi, tidak jarang hal ini membangkitkan sentimen negatif dari pihak laki-laki yang merasa tertekan dan kehilangan martabat jika tidak mampu memenuhinya. Alhasil, penundaan pernikahan diambil guna memenuhi permintaan belis. Konflik semacam ini bisa merusak hubungan dua keluarga yang harusnya harmonis. Sumber: https://beritakini.co.id/detail/36671/tradisi-belis-simbol-budaya-yang-menyimpan-beban-finansial-di-era-modern https://www.krajan.id/belis-dalam-pernikahan-adat-ntt-simbol-budaya-atau-beban-sosial/#google_vignette</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Apa makna kata sesepuh pada teks tersebut', opts:['keluarga yang dihormati oleh seluruh warga desa','orang yang dituakan atau dijadikan pemimpin','masyarakat yang memiliki peran penting','pengurus atau perangkat desa yang sudah tua','laki-laki yang sudah menikah dan memiliki anak'], kunci:[1], bahas:'<b>Sesuai kunci web defantri: (B) orang yang dituakan atau dijadikan pemimpin.</b> Difetch langsung dari atribut value=correct pada halaman.'},

{id:26, passage:'<div class="passage-title">Interaksi Sosial di Era Digital<br><small>Soal 26 — full teks dari web</small></div><p>Teks untuk soal nomor 26 s.d. 29. Interaksi Sosial di Era Digital Penggunaan telepon genggam menjadi kebutuhan pokok di era digital. Mayoritas masyarakat saat ini sudah menggunakan telepon genggam. Kemudahan akses informasi dan komunikasi yang diperoleh dari penggunaan telepon genggam memberikan manfaat sekaligus dampak yang masif terhadap interaksi sosial di tengah masyarakat. Berdasarkan data Badan Pusat Statistik (BPS), proporsi Individu yang memiliki telepon genggam menurut kelompok umur didominasi oleh orang-orang dengan rentang usia 15-24. Artinya, masyarakat kelahiran tahun 2000 termasuk individu yang mendominasi pemilik dan pengguna telepon genggam. Individu pada rentang usia tersebut tergolong dalam generasi Z (gen-Z) yang lahir dan tumbuh pada era internet dan telepon genggam. Perubahan cara komunikasi dari tatap muka ke virtual seiring dengan berkembangnya telepon genggam menjadi ponsel pintar mengubah pola interaksi sosial. Dibanding ruang fisik, gen-z lebih menyukai interaksi pada ruang virtual. Hal itu mengurangi kualitas interaksi sosial secara langsung. Dalam satu ruang yang sama, mereka bisa lebih fokus pada interaksi virtual melalui ponsel pintar daripada berkomunikasi langsung dengan orang-orang di sekitarnya. Perubahan pola interaksi sosial tersebut merupakan tantangan di era perkembangan teknologi. Berdasarkan hasil observasi yang dilakukan tahun 2020, sebagian besar informan menyatakan bahwa terdapat faktor eksternal dan internal yang menjadi pemicu terjadinya pergeseran pola interaksi dalam masyarakat. Pertama, faktor eksternal dari alat-alat canggih seperti ponsel pintar yang mampu menghubungkan komunikasi tanpa melalui tatap muka. Kedua, faktor internal berupa ketergantungan ponsel pintar dan perilaku phubbing. Pergeseran pola interaksi sosial membuat nilai-nilai budaya seperti tenggang rasa, sopan santun, empati, dan kepedulian sosial menurun. Ungkapan &quot;mendekatkan yang jauh dan menjauhkan yang dekat&quot; pada era digital merupakan suatu realitas yang dapat menjadi bahan refleksi untuk semua orang. Adanya pergeseran pola interaksi sosial secara khusus menuntut orang tua memberikan pemahaman yang lebih pada anaknya agar tetap mempertahankan nilai budaya. Ponsel pintar terus berkembang setiap tahun dengan fitur-fitur yang menawarkan kepraktisan tanpa disadari akan mengontrol penggunanya untuk mengabaikan interaksi sosial secara langsung. Oleh karena itu, perlu kesadaran bersama untuk memanfaatkan ponsel pintar secara bijak tanpa mengabaikan interaksi sosial dalam ruang fisik. Upaya tersebut merupakan langkah nyata untuk melestarikan nilai-nilai budaya dan menjaga hubungan sosial. Referensi: Artikel ilmiah &quot;Pergeseran Pola Interaksi Sosial&quot; oleh Iva St Syahrah, dkk dan data BPS dari artikel Gen Z Mendominasi Pengguna Handphone Indonesia dalam https://data.goodstats.id/</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Apa makna kata diunduh dalam teks tersebut', opts:['diakses dengan internet','diambil dari internet','diakses dari aplikasi','dikontrol dari aplikasi','dibuat dari aplikasi'], kunci:[1], bahas:'<b>Sesuai kunci web defantri: (B) diambil dari internet.</b> Difetch langsung dari atribut value=correct pada halaman.'},

{id:30, passage:'<div class="passage-title">Roh Meratus<br><small>Soal 30 — full teks dari web</small></div><p>Teks untuk soal nomor 30 s.d. 33. Roh Meratus Kami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah. Aku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungkan, semak-semak yang rimbun itu. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon! &quot;Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan...&quot; tetua menghentikan langkahnya dan mengambil sesuatu dalam butah. &quot;Roh Meratus meniupkan wisa ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat,&quot; sambungnya kemudian melemparkan gulungan kertas yang diambil dari butah. Sigap kutangkap gulungan itu. &quot;Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu,&quot; katanya dingin. Perlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-pohon ini, sulur-sulur ini, lumut-lumut ini, udang-udang ini...akan bagaimana? &quot;Tetua, izinkan aku tinggal di sini dan bersama kaummu menjaga tempat ini...&quot; Akhirnya setelah lama hanya diam, aku menatap mata tetua mantap. (Cerpen karya Zaidinoor) Glosarium Butah: wadah atau tempat yang digunakan untuk membawa sesuatu, biasanya terbuat dari anyaman rotan atau bambu Wisa: bisa atau racun Latar tempat yang tergambar dalam cerita tersebut adalah.... $(B)$ daerah perkotaan yang ramai. $(C)$ pegunungan batu yang tandus. $(D)$ hutan belantara yang lebat. $(E)$ pantai dengan pasir putih.</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Teks untuk soal nomor 30 s.d. 33. Roh Meratus Kami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah. Aku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungkan, semak-semak yang rimbun itu. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon! "Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan..." tetua menghentikan langkahnya dan mengambil sesuatu dalam butah. "Roh Meratus meniupkan wisa ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat," sambungnya kemudian melemparkan gulungan kertas yang diambil dari butah. Sigap kutangkap gulungan itu. "Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu," katanya dingin. Perlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-poh', opts:['sebuah perkampungan penduduk adat','daerah perkotaan yang ramai','pegunungan batu yang tandus','hutan belantara yang lebat','pantai dengan pasir putih'], kunci:[3], bahas:'<b>Sesuai kunci web defantri: (D) hutan belantara yang lebat.</b> Difetch langsung dari atribut value=correct pada halaman.'},

tan atau bambu Wisa: bisa atau racun Apa yang akan dilakukan tokoh utama setelah mengalami peristiwa tersebut?.... $(B)$ Menyelesaikan proyek sesuai rencana agar kontrak kerja tidak batal. $(C)$ Meninggalkan hutan tanpa memberi tahu tetua untuk menghindari konflik. $(D)$ Menyampaikan laporan kepada perusahaan untuk mempercepat pengerahan alat berat. $(E)$ Mencari orang pintar untuk mengusir Roh Meratus yang berada di hutan tersebut.</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'pg', tanya:'Teks untuk soal nomor 30 s.d. 33. Roh Meratus Kami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah. Aku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungkan, semak-semak yang rimbun itu. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon! "Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan..." tetua menghentikan langkahnya dan mengambil sesuatu dalam butah. "Roh Meratus meniupkan wisa ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat," sambungnya kemudian melemparkan gulungan kertas yang diambil dari butah. Sigap kutangkap gulungan itu. "Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu," katanya dingin. Perlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-poh', opts:['Meninggalkan pekerjaannya dan bergabung dengan tetua untuk melindungi hutan','Menyelesaikan proyek sesuai rencana agar kontrak kerja tidak batal','Meninggalkan hutan tanpa memberi tahu tetua untuk menghindari konflik','Menyampaikan laporan kepada perusahaan untuk mempercepat pengerahan alat berat','Mencari orang pintar untuk mengusir Roh Meratus yang berada di hutan tersebut'], kunci:[0], bahas:'<b>Sesuai kunci web defantri: (A) Meninggalkan pekerjaannya dan bergabung dengan tetua untuk melindungi hutan.</b> Difetch langsung dari atribut value=correct pada halaman.'},
{id:33, passage:'<div class="passage-title">Roh Meratus<br><small>Soal 33 — full teks dari web</small></div><p>Teks untuk soal nomor 30 s.d. 33. Roh Meratus Kami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah. Aku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungkan, semak-semak yang rimbun itu. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon! &quot;Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan...&quot; tetua menghentikan langkahnya dan mengambil sesuatu dalam butah. &quot;Roh Meratus meniupkan wisa ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat,&quot; sambungnya kemudian melemparkan gulungan kertas yang diambil dari butah. Sigap kutangkap gulungan itu. &quot;Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu,&quot; katanya dingin. Perlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-pohon ini, sulur-sulur ini, lumut-lumut ini, udang-udang ini...akan bagaimana? &quot;Tetua, izinkan aku tinggal di sini dan bersama kaummu menjaga tempat ini...&quot; Akhirnya setelah lama hanya diam, aku menatap mata tetua mantap. (Cerpen karya Zaidinoor) Glosarium Butah: wadah atau tempat yang digunakan untuk membawa sesuatu, biasanya terbuat dari anyaman rotan atau bambu Wisa: bisa atau racun Perubahan sikap tokoh utama ditunjukkan melalui tindakannya di akhir kutipan. Manakah pernyataan yang paling tepat untuk menilai kesesuaian antara karakter tokoh dan tindakannya? Tentukan apakah setiap pernyataan berikut Benar atau Salah . Tindakan tokoh utama sesuai karena ia menunjukkan kepedulian terhadap kelestarian hutan setelah mengalami perubahan pandangan. Tindakan tokoh utama tidak sesuai karena ia telah meninggalkan kewajiban dalam menyelesaikan kontrak kerja. Tindakan tokoh utama sesuai karena ia ingin membuktikan bahwa ia mampu memimpin proyek tanpa menggunakan alat berat.</p><p><small>Sumber: defantri.com Model B</small></p>', tipe:'bs', tanya:'Perubahan sikap tokoh utama ditunjukkan melalui tindakannya di akhir kutipan. Manakah pernyataan yang paling tepat?<br><small>Tentukan Benar / Salah.</small>', labels:['Benar','Salah'], statements:['Tindakan tokoh utama sesuai karena ia menunjukkan kepedulian terhadap kelestarian hutan setelah mengalami perubahan pandangan.','Tindakan tokoh utama tidak sesuai karena ia telah meninggalkan kewajiban dalam menyelesaikan kontrak kerja.','Tindakan tokoh utama sesuai karena ia ingin membuktikan bahwa ia mampu memimpin proyek tanpa menggunakan alat berat.'], kunci:['Benar','Salah','Salah'], bahas:'<b>Sesuai kunci web defantri.</b> Kunci: Benar | Salah | Salah.'}
];

let cur=0, answers={}, hasil={}, ragu={};
function setFont(px){document.documentElement.style.setProperty('--soal-font',px+'px')}
let sisa=4493; setInterval(()=>{sisa=Math.max(0,sisa-1);let h=String(Math.floor(sisa/3600)).padStart(2,'0'),m=String(Math.floor(sisa%3600/60)).padStart(2,'0'),s=String(sisa%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s},1000);

function render(){
const q=SOAL[cur];
document.getElementById('nomor').textContent='Soal nomor '+(cur+1);
document.getElementById('teks').innerHTML=q.passage;
document.getElementById('prog').textContent=(cur+1)+' / '+SOAL.length;
let h='<p><b>'+q.tanya+'</b></p>';
if(q.tipe==='pg'){
q.opts.forEach((o,i)=>{const c=answers[q.id]===i?'checked':'';h+='<label class="opt" id="opt-'+i+'"><input type="radio" name="q'+q.id+'" '+(c)+' onclick="jawab('+i+')"> <span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>'});
}else if(q.tipe==='cek'){
q.opts.forEach((o,i)=>{const c=(answers[q.id]||[]).includes(i)?'checked':'';h+='<label class="opt" id="opt-'+i+'"><input type="checkbox" '+(c)+' onclick="jawabCek('+i+')"> <span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>'});
h+='<p style="font-size:13px;color:#666">Bisa pilih lebih dari satu.</p>';
}else if(q.tipe==='bs'){
h+='<table class="bs"><tr><th>Pernyataan</th><th>'+q.labels[0]+'</th><th>'+q.labels[1]+'</th></tr>';
q.statements.forEach((s,i)=>{const v=(answers[q.id]||{})[i];h+='<tr id="row-'+i+'"><td>'+(i+1)+'. '+s+'</td><td style="text-align:center"><input type="radio" name="bs'+i+'" '+(v===q.labels[0]?'checked':'')+' onclick="jawabBS('+i+',0)"></td><td style="text-align:center"><input type="radio" name="bs'+i+'" '+(v===q.labels[1]?'checked':'')+' onclick="jawabBS('+i+',1)"></td></tr>'});
h+='</table>';
}else if(q.tipe==='info'){
h+='<p style="color:#888">Soal ini membutuhkan gambar/opsi yang tidak terlampir. Baca pembahasan di bawah.</p><button class="btn check" onclick="periksa()">Lihat Pembahasan</button>';
}
h+='<div style="margin-top:10px;display:flex;gap:8px"><button class="btn check" onclick="periksa()">Periksa Jawaban</button><button class="btn ghost" onclick="ulangi()">Ulangi</button></div>';
h+='<div class="explain" id="expl"></div>';
document.getElementById('soal').innerHTML=h;
document.getElementById('soal').scrollTop=0;
const rb=document.getElementById('raguBtn');rb.textContent=ragu[q.id]?'☑ Ragu-ragu':'☐ Ragu-ragu';rb.style.background=ragu[q.id]?'#ff8f00':'#f7b500';
if(hasil[q.id])showHasil(false);
}
function jawab(i){answers[SOAL[cur].id]=i}
function jawabCek(i){const id=SOAL[cur].id;let a=answers[id]||[];a=a.includes(i)?a.filter(x=>x!==i):[...a,i];answers[id]=a}
function jawabBS(i,li){const q=SOAL[cur];const id=q.id;let a=answers[id]||{};a[i]=q.labels[li];answers[id]=a}
function ulangi(){const id=SOAL[cur].id;delete answers[id];delete hasil[id];render()}
function nav(d){cur=Math.min(SOAL.length-1,Math.max(0,cur+d));render()}
function toggleRagu(){const id=SOAL[cur].id;ragu[id]=!ragu[id];render()}
function arraysEqual(a,b){if(a.length!==b.length)return false;let x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i])}
function periksa(){
const q=SOAL[cur],id=q.id;let benar=false,skor='';
if(q.tipe==='pg'){const j=answers[id];if(j===undefined){alert('Pilih dulu jawabanmu!');return}benar=q.kunci.includes(j);
q.opts.forEach((_,i)=>{const el=document.getElementById('opt-'+i);if(!el)return;el.classList.remove('correct','wrong');if(q.kunci.includes(i))el.classList.add('correct');else if(i===j)el.classList.add('wrong')});
}else if(q.tipe==='cek'){const j=answers[id]||[];if(!j.length){alert('Pilih dulu minimal satu!');return}benar=arraysEqual(j,q.kunci);
q.opts.forEach((_,i)=>{const el=document.getElementById('opt-'+i);el.classList.remove('correct','wrong');if(q.kunci.includes(i))el.classList.add('correct');if(j.includes(i)&&!q.kunci.includes(i))el.classList.add('wrong')});
}else if(q.tipe==='bs'){const j=answers[id]||{};if(Object.keys(j).length<q.statements.length){alert('Isi semua pernyataan dulu!');return}
benar=q.statements.every((_,i)=>j[i]===q.kunci[i]);
q.statements.forEach((_,i)=>{const r=document.getElementById('row-'+i);r.classList.remove('row-ok','row-bad');r.classList.add(j[i]===q.kunci[i]?'row-ok':'row-bad')});
}else{benar=null}
if(benar!==null)hasil[id]=benar;
showHasil(true);
updateGrid();
}
function showHasil(scroll){
const q=SOAL[cur],id=q.id;const ex=document.getElementById('expl');if(!ex)return;
if(q.tipe==='info'){ex.innerHTML='<b class="t">ℹ️ Info:</b><br>'+q.bahas;ex.classList.add('show');return}
const ok=hasil[id];let badge=ok===undefined?'':(ok?'<span class="badge ok">✅ BENAR</span>':'<span class="badge bad">❌ SALAH</span>');
let kunciTxt='';
if(q.tipe==='pg')kunciTxt='Kunci: <b>'+String.fromCharCode(65+q.kunci[0])+'. '+q.opts[q.kunci[0]]+'</b>';
if(q.tipe==='cek')kunciTxt='Kunci: <b>'+q.kunci.map(i=>String.fromCharCode(65+i)).join(', ')+'</b>';
if(q.tipe==='bs')kunciTxt='Kunci: <b>'+q.kunci.join(' | ')+'</b>';
ex.innerHTML=badge+'<br><br>'+kunciTxt+'<br><br><b class="t">💡 Pembahasan:</b><br>'+q.bahas;
ex.classList.add('show');if(scroll)ex.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openDaftar(){document.getElementById('modal').classList.add('show');updateGrid()}
function closeDaftar(){document.getElementById('modal').classList.remove('show')}
function updateGrid(){
const g=document.getElementById('grid');g.innerHTML='';
SOAL.forEach((q,i)=>{const d=document.createElement('div');d.className='cell';d.textContent=i+1;
if(i===cur)d.classList.add('cur');if(ragu[q.id])d.classList.add('ragu');
if(hasil[q.id]===true)d.classList.add('benar');if(hasil[q.id]===false)d.classList.add('salah');
d.onclick=()=>{cur=i;closeDaftar();render()};g.appendChild(d)});
let b=Object.values(hasil).filter(v=>v===true).length,s=Object.values(hasil).filter(v=>v===false).length;
document.getElementById('score').innerHTML='Sudah diperiksa: <b>'+(b+s)+' / '+SOAL.length+'</b> — Benar: <b style="color:green">'+b+'</b> | Salah: <b style="color:red">'+s+'</b>'+(b+s>0?'<br>Nilai (dari yang diperiksa): <b>'+Math.round(b/Math.max(1,b+s)*100)+'</b>':'');
}
function resetAll(){answers={};hasil={};ragu={};render();updateGrid()}
render();updateGrid();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1)});
</script>
